name: CI environment
description: Julia, and the depot and project the setup job resolved and precompiled
inputs:
  depot-key:
    description: Cache key of the setup job's depot
    required: true
runs:
  using: composite
  steps:
    - uses: julia-actions/setup-julia@v2
      with:
        version: '1.12'
    - uses: actions/cache/restore@v4
      with:
        path: ~/.julia
        key: ${{ inputs.depot-key }}
        fail-on-cache-miss: true
    - uses: actions/download-artifact@v4
      with:
        name: ci-environment
        path: .ci
    - name: Check that nothing needs compiling
      shell: bash
      run: julia --project=.ci .ci/check_precompiled.jl
