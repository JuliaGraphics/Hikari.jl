name: CI
on:
  push:
    branches:
      - master
      - sd/lava-refactor
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test-group:
    name: Tests / ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: ["1", "2", "3", "4", "pbrt-materials", "pbrt-textures", "pbrt-other"]
    runs-on: ubuntu-latest
    # Isolated groups release compiler and driver state between test processes.
    # The reference groups retain the complete 256-spp pbrt comparison.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Resolve published backend dependencies
        run: julia --project=.ci .ci/setup.jl
      - name: Run tests with Lavapipe_jll
        run: xvfb-run -a julia --project=.ci .ci/run_tests.jl "${{ matrix.group }}"
        env:
          # pbrt reference suite renders at HIGH spp so the gate can stay
          # TIGHT (tile<0.07, energy in [0.95,1.05]) with no per-scene or
          # SPP-dependent relaxations — a scene that misses the band is a
          # real bug, not a threshold to widen. The full SW suite (151
          # scenes) clears the tight band at 256 spp; locally on lavapipe
          # (LLVM 22, 12-core) that is ~19 min. The Azure CI runner is
          # slower, hence the raised job timeout below.
          HIKARI_TEST_LAVAPIPE: "true"
          HIKARI_PBRT_SPP: "256"
          # Skip the HW-RT pbrt run on CI. Modern Mesa lavapipe DOES report
          # rt_pipeline_properties (so `hw_rt_available()` returns true and
          # the suite tries the HW path), but lavapipe implements VK_KHR_
          # ray_tracing_pipeline in software via its LLVM JIT — every shader
          # in the suite has to be re-JIT'd before each scene renders, which
          # is far too slow to get through 151 scenes at 256 spp inside any
          # reasonable job budget. SW pbrt is the gate; HW pbrt runs on
          # real-HW (RADV / NVIDIA) dev machines. The HW RT code path (the
          # Lava SER fallback to OpTraceRayKHR on non-SER devices) is still
          # exercised on lavapipe by the smaller HW-using tests earlier in
          # runtests.jl:
          #   - test_hw_sw_parity.jl    (1-shot HW vs SW image)
          #   - test_multitypeset_updates.jl J4 (HW after update_material!)
          #   - test_volpath_per_iter_lifecycle.jl (HW lifecycle, 24 tests)
          # Skipping HW pbrt here means we don't re-render 450 scenes
          # through the JIT-emulated RT pipeline; full HW pbrt is still
          # expected to run on real-HW (RADV / NVIDIA) developer machines.
          HIKARI_SKIP_PBRT_HW: "true"

      - name: Verify material shader cache across Julia sessions
        if: matrix.group == '1'
        env:
          HIKARI_TEST_LAVAPIPE: "true"
          # Keep this working set independent of the preceding full test group.
          JULIA_OBJCACHE_PATH: ${{ runner.temp }}/hikari-material-cache-probe
          HIKARI_CACHE_PROBE_REFERENCE: ${{ runner.temp }}/hikari-material-cache-image.sha256
        run: |
          xvfb-run -a julia --project=.ci .ci/cache_probe.jl
          xvfb-run -a julia --project=.ci .ci/cache_probe.jl --cached

  test:
    name: Tests
    needs: test-group
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test group
        env:
          GROUP_RESULT: ${{ needs['test-group'].result }}
        run: test "$GROUP_RESULT" = success

  pbrt-comparison:
    name: pbrt-v4 Comparison
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install comparison dependencies
        run: julia --project=.ci .ci/setup.jl test/pbrt
      # Two steps, because rendering and presenting are separate now: the suite
      # renders, checks and records, and run_comparison.jl only turns that
      # record into a page. It used to do both, with its own thresholds, and
      # those had drifted looser than the suite's.
      - name: Render and compare
        env:
          # 256 spp on lavapipe across the scene set blows past the 120-min job
          # budget; 32 spp populates a representative gallery. That is BELOW the
          # noise floor the ±5 % band assumes, so scenes will show as failing
          # here that pass at 256 spp on real hardware — this job builds a
          # report, the normal test job is what decides pass/fail.
          HIKARI_TEST_LAVAPIPE: "true"
          HIKARI_PBRT_SPP: "32"
        continue-on-error: true
        run: xvfb-run -a julia --project=.ci -e 'include("test/lavapipe.jl"); include("test/pbrt/test_pbrt_all_materials.jl"); run_pbrt_suite(; samples = parse(Int, ENV["HIKARI_PBRT_SPP"]), hw_accel = false)'
      - name: Build gallery
        run: julia --project=.ci test/pbrt/run_comparison.jl
      - uses: actions/upload-artifact@v4
        with:
          name: pbrt-comparison
          path: test/pbrt/display/

  docs-build:
    name: Build Docs
    runs-on: ubuntu-latest
    # The last green build took 46 min (10 install, 36 build), before the material,
    # texture and recipe galleries were added.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=.ci .ci/setup.jl docs
      - name: Build (without comparison gallery)
        env:
          HIKARI_TEST_LAVAPIPE: "true"
          GKSwstype: "100"
          DATADEPS_ALWAYS_ACCEPT: true
        run: xvfb-run -a julia --project=.ci --color=yes -e 'include("test/lavapipe.jl"); include("docs/make.jl")'
      - uses: actions/upload-artifact@v4
        with:
          name: docs-build
          path: docs/build/

  deploy-docs:
    name: Deploy Docs
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    needs: [pbrt-comparison, docs-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Download docs build
        uses: actions/download-artifact@v4
        with:
          name: docs-build
          path: docs/build/
      - name: Download comparison gallery
        uses: actions/download-artifact@v4
        with:
          name: pbrt-comparison
          path: docs/build/1/pbrt-comparison/
      - name: Install dependencies
        run: julia --project=.ci .ci/setup.jl docs
      - name: Deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: |
          julia --project=.ci -e '
            using DocumenterVitepress
            DocumenterVitepress.deploydocs(;
              root = "docs",
              repo = "github.com/JuliaGraphics/Hikari.jl",
              target = "build",
              branch = "gh-pages",
              devbranch = "master",
              push_preview = true,
            )
          '
